name = "cloudtask-api"
main = "src/index.ts"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ORIGIN = "http://localhost:8788"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "cloudtask-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
